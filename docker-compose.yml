version: '3.8'

services:
  # ================= BANCO DE DADOS POSTGRESQL (ACID) =================
  db:
    image: postgres:16-alpine
    container_name: minierp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minierp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minierp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ================= APLICAÇÃO FULL-STACK (API + FRONTEND) =================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minierp_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: minierp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
