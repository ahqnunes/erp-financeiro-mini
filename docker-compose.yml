services:
  db:
    image: postgres:16-alpine
    container_name: minierp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minierp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minierp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minierp_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MINIERP_ENVIRONMENT: production
      MINIERP_DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/minierp
      MINIERP_FRONTEND_DIR: /app/dist
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local